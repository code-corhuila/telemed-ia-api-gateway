# ---------------------------------------------------------------------------
# Headers every response must carry.
#
# NGINX drops outer `add_header` directives as soon as a `location` declares
# its own. That is why this file is included in `20-server.conf` AND in every
# location that adds its own headers.
# ---------------------------------------------------------------------------

add_header X-Correlation-Id $correlation_id always;

# CORS: only the container's origins, never `*` with credentials.
add_header Access-Control-Allow-Origin  $cors_origin always;
add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
add_header Access-Control-Allow-Headers "Authorization, Content-Type, Idempotency-Key, X-Correlation-Id" always;
add_header Access-Control-Expose-Headers "X-Correlation-Id, Location" always;
add_header Access-Control-Allow-Credentials "true" always;
add_header Vary "Origin" always;