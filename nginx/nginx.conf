user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ---------------------------------------------------------------------
    # JSON access log with correlationId so every request can be followed
    # across the gateway and the downstream service.
    # ---------------------------------------------------------------------
    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"method":"$request_method",'
            '"uri":"$request_uri",'
            '"status":$status,'
            '"bytes":$body_bytes_sent,'
            '"duration_ms":$request_time,'
            '"correlationId":"$correlation_id",'
            '"upstream":"$upstream_addr",'
            '"upstream_status":"$upstream_status",'
            '"remoteAddr":"$remote_addr"'
        '}';

    access_log /var/log/nginx/access.log json_combined;

    # Body size limit. Any larger request is rejected before reaching the service.
    client_max_body_size 1m;

    # Timeouts.
    client_body_timeout   10s;
    client_header_timeout 5s;
    send_timeout          10s;

    sendfile        on;
    keepalive_timeout  30s;

    # Do not leak the NGINX version in error pages or Server header.
    server_tokens off;

    include /etc/nginx/conf.d/*.conf;
}