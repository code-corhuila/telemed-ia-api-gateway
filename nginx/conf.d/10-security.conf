# ---------------------------------------------------------------------------
# Correlation id: reuse the incoming header or generate a new one.
# ---------------------------------------------------------------------------

map $http_x_correlation_id $correlation_id {
    default $http_x_correlation_id;
    ""      $request_id;
}

# ---------------------------------------------------------------------------
# CORS: only the container's origins are allowed.
# ---------------------------------------------------------------------------

map $http_origin $cors_origin {
    default "";
    "http://localhost:4200"  $http_origin;
    "http://localhost:4201"  $http_origin;
    "http://localhost:4202"  $http_origin;
    "http://localhost:4203"  $http_origin;
    "https://telemed-ia.example" $http_origin;
}

# ---------------------------------------------------------------------------
# Rate limiting.
# ---------------------------------------------------------------------------

limit_req_zone $binary_remote_addr zone=gateway_per_ip:10m rate=20r/s;
limit_req_status 429;

# ---------------------------------------------------------------------------
# Credential filter. A protected route that reaches the gateway without an
# Authorization header is rejected here. Validation of the token itself
# happens in each service (norm 5.6.2), because internal calls between
# services do not pass through the gateway.
# ---------------------------------------------------------------------------

map $http_authorization $has_credentials {
    default 1;
    ""      0;
}