server {
    listen 80 default_server;
    server_name _;

    # -----------------------------------------------------------------------
    # Response helpers: the common error envelope (norm 5.3.5).
    # -----------------------------------------------------------------------

    # 401 UNAUTHORIZED
    error_page 401 = @err_401;
    location @err_401 {
        default_type application/json;
        return 401 '{"error":"UNAUTHORIZED","message":"missing or invalid credentials","traceId":"$correlation_id"}';
    }

    # 404 NOT_FOUND
    error_page 404 = @err_404;
    location @err_404 {
        default_type application/json;
        return 404 '{"error":"NOT_FOUND","message":"resource not found","traceId":"$correlation_id"}';
    }

    # 429 TOO_MANY_REQUESTS
    error_page 429 = @err_429;
    location @err_429 {
        default_type application/json;
        add_header Retry-After 1 always;
        return 429 '{"error":"TOO_MANY_REQUESTS","message":"too many requests","traceId":"$correlation_id"}';
    }

    # 503 SERVICE_UNAVAILABLE
    error_page 502 503 504 = @err_503;
    location @err_503 {
        default_type application/json;
        return 503 '{"error":"SERVICE_UNAVAILABLE","message":"the service is unavailable","traceId":"$correlation_id"}';
    }

    # -----------------------------------------------------------------------
    # Health of the gateway itself.
    # -----------------------------------------------------------------------

    location = /health {
        default_type application/json;
        add_header X-Correlation-Id $correlation_id always;
        return 200 '{"status":"UP","service":"api-gateway"}';
    }

    # -----------------------------------------------------------------------
    # CORS preflight.
    # -----------------------------------------------------------------------

    location = /api/v1/__options__ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Idempotency-Key, X-Correlation-Id" always;
            add_header Access-Control-Max-Age 600 always;
            return 204;
        }
        return 404;
    }

    # -----------------------------------------------------------------------
    # Domain routes.
    # -----------------------------------------------------------------------

    include /etc/nginx/routes/*.conf;

    # Anything else is 404 with the common envelope.
    location / {
        return 404;
    }
}