# ---------------------------------------------------------------------------
# Per-request DNS resolution.
#
# 127.0.0.11 is the internal Docker DNS. With a static `upstream` block NGINX
# resolves every name once at start-up, so a domain that is down at that
# moment prevents the gateway from starting. Using `resolver` plus a variable
# in `proxy_pass` forces resolution on every request: if one domain is down,
# only that route returns 503 and the rest keep working.
# ---------------------------------------------------------------------------

resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;