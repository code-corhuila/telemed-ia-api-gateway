# ---------------------------------------------------------------------------
# workflow routes (HU-05 professional onboarding saga, ADR-028, WF-004).
#
# Public path:    /api/v1/sagas/...
# Service path:   /api/v1/sagas/...
# telemed-ia-workflow already serves under /api/v1, so nothing is rewritten.
#
# workflow-api joins the `platform` network under that name and listens on
# :8080 (`expose` only, never published). It validates the token itself
# (RS256) and serves only the ADMIN role.
# ---------------------------------------------------------------------------

location /api/v1/sagas {
    # Onboarding is an administrator action: a small burst is enough.
    limit_req zone=gateway_per_ip burst=10 nodelay;

    if ($has_credentials = 0) {
        return 401;
    }

    set $workflow_api http://workflow-api:8080;

    proxy_pass $workflow_api;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-Id  $correlation_id;

    # The saga runs inside the request: three participant calls, each with a
    # 5 s timeout and bounded retries (WF-005), so it may take longer than
    # the 15 s of the other routes.
    proxy_connect_timeout 3s;
    proxy_send_timeout    10s;
    proxy_read_timeout    45s;

    include /etc/nginx/snippets/headers.conf;
}
