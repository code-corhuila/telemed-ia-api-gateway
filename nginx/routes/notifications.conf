# ---------------------------------------------------------------------------
# notifications routes (HU-17 notification inbox).
#
# Public path:    /api/v1/notifications/...
# Service path:   /api/v1/notifications/...
# notifications-api already serves under /api/v1, so nothing is rewritten.
#
# notifications-api joins the `platform` network under that name and listens
# on :8082. It validates the token itself (RS256) and only ever serves the
# inbox of the token's user.
# ---------------------------------------------------------------------------

location /api/v1/notifications {
    # The portal polls the unread count, so a larger burst than most routes.
    limit_req zone=gateway_per_ip burst=40 nodelay;

    if ($has_credentials = 0) {
        return 401;
    }

    set $notifications_api http://notifications-api:8082;

    proxy_pass $notifications_api;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-Id  $correlation_id;

    proxy_connect_timeout 3s;
    proxy_send_timeout    10s;
    proxy_read_timeout    15s;

    include /etc/nginx/snippets/headers.conf;
}
