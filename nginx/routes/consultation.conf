# ---------------------------------------------------------------------------
# medical-consultation routes.
#
# Public path:    /api/v1/consultations/...
# Service path:   /api/consultations/...
# The gateway strips the /v1 segment before proxying.
#
# NOTE (dev): the medical-consultation API currently runs on the host
# (`go run ./cmd/consultation-api` on :8080), not as a container on the
# `platform` network. Port 8080 collides with appointment-scheduling-api,
# so only ONE of the two can run at a time (see project rule "una API por vez").
#
# When the API is dockerized and joined to `platform`, switch to:
#   set $consultation_api http://consultation-api:8080;
# ---------------------------------------------------------------------------

location /api/v1/consultations {
    limit_req zone=gateway_per_ip burst=40 nodelay;

    if ($has_credentials = 0) {
        return 401;
    }

    set $consultation_api http://host.docker.internal:8080;
    rewrite ^/api/v1/consultations(.*)$ /api/consultations$1 break;

    proxy_pass $consultation_api;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-Id  $correlation_id;

    proxy_connect_timeout 3s;
    proxy_send_timeout    10s;
    proxy_read_timeout    15s;

    include /etc/nginx/snippets/headers.conf;
}