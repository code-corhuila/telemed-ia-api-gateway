# ---------------------------------------------------------------------------
# medical-consultation post-summary read (HU-15).
#
# Public path:    /api/v1/consultations/post-summaries/{id}  (consultation-service.yaml)
# Service path:   /api/post-summaries/{id}
#
# A longer prefix than /api/v1/consultations, so nginx picks this block for
# these requests; every other consultation path keeps using consultation.conf.
# ---------------------------------------------------------------------------

location /api/v1/consultations/post-summaries/ {
    limit_req zone=gateway_per_ip burst=40 nodelay;

    if ($has_credentials = 0) {
        return 401;
    }

    set $consultation_api http://medical-consultation-api:8080;
    rewrite ^/api/v1/consultations/post-summaries/(.*)$ /api/post-summaries/$1 break;

    proxy_pass $consultation_api;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-Id  $correlation_id;

    proxy_connect_timeout 3s;
    proxy_send_timeout    10s;
    proxy_read_timeout    15s;

    include /etc/nginx/snippets/headers.conf;
}
