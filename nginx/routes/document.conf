# ---------------------------------------------------------------------------
# document-generation routes (HU-16 consultation PDF).
#
# Public path:    /api/v1/documents/...
# Service path:   /api/documents/...
# The gateway strips the /v1 segment before proxying.
#
# document-generation-api joins the `platform` network under that name and
# listens on :8080 (`expose` only, never published). It validates the token
# itself (RS256): patients read their own documents, POST /generate is for
# the SERVICE and ADMIN roles.
# ---------------------------------------------------------------------------

location /api/v1/documents {
    limit_req zone=gateway_per_ip burst=20 nodelay;

    if ($has_credentials = 0) {
        return 401;
    }

    set $document_api http://document-generation-api:8080;
    rewrite ^/api/v1/documents(.*)$ /api/documents$1 break;

    proxy_pass $document_api;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-Id  $correlation_id;

    # Same as the other routes: no answer waits on the PDF. POST /generate
    # answers 201 with the document PENDING and renders it in the background;
    # /download answers a short-lived URL, and the file comes from the
    # object storage, not through the gateway.
    proxy_connect_timeout 3s;
    proxy_send_timeout    10s;
    proxy_read_timeout    15s;

    include /etc/nginx/snippets/headers.conf;
}
