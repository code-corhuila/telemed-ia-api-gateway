# ---------------------------------------------------------------------------
# appointment-scheduling routes.
#
# Public path:    /api/v1/appointments/...
# Service path:   /api/appointments/...
# The gateway strips the /v1 segment before proxying.
#
# NOTE (dev): the appointment-scheduling API currently runs on the host
# (`python -m apps.api`), not as a container on the `platform` network,
# so we target host.docker.internal. When the API is dockerized and joined
# to `platform`, switch to: set $appointments_api http://appointments-api:8080;
# ---------------------------------------------------------------------------

location /api/v1/appointments {
    limit_req zone=gateway_per_ip burst=40 nodelay;

    if ($has_credentials = 0) {
        return 401;
    }

    set $appointments_api http://host.docker.internal:8080;
    rewrite ^/api/v1/appointments(.*)$ /api/appointments$1 break;

    proxy_pass $appointments_api;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-Id  $correlation_id;

    proxy_connect_timeout 3s;
    proxy_send_timeout    10s;
    proxy_read_timeout    15s;

    include /etc/nginx/snippets/headers.conf;
}