# ---------------------------------------------------------------------------
# patient-management routes.
#
# `/api/v1/patients` and every subpath go to the patient service. Internal
# services are reached by their service name on the `platform` network.
# ---------------------------------------------------------------------------

location /api/v1/patients {
    limit_req zone=gateway_per_ip burst=40 nodelay;

    if ($has_credentials = 0) {
        return 401;
    }

    set $patients_api http://patients-api:8080;
    proxy_pass $patients_api;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-Id  $correlation_id;

    proxy_connect_timeout 3s;
    proxy_send_timeout    10s;
    proxy_read_timeout    15s;

    include /etc/nginx/snippets/headers.conf;
}