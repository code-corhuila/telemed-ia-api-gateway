# ---------------------------------------------------------------------------
# identity-and-access routes.
#
# Public path:    /api/v1/auth/...
# Service path:   /api/v1/auth/...
# identity-api already serves under /api/v1, so nothing is rewritten.
#
# No credentials check here, on purpose: login, register, refresh and
# password recovery are used without a session. /auth/session and
# /auth/logout validate the bearer token inside identity-api.
# ---------------------------------------------------------------------------

location /api/v1/auth {
    # Smaller burst than the other routes: slows down password guessing.
    limit_req zone=gateway_per_ip burst=10 nodelay;

    set $identity_api http://identity-api:8081;

    proxy_pass $identity_api;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-Id  $correlation_id;

    proxy_connect_timeout 3s;
    proxy_send_timeout    10s;
    proxy_read_timeout    15s;

    include /etc/nginx/snippets/headers.conf;
}
