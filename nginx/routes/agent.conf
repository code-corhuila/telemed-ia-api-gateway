# ---------------------------------------------------------------------------
# intelligent-agent routes (HU-06 pre-consultation).
#
# Public path:    /api/v1/agent/...
# Service path:   /api/v1/agent/...
# intelligent-agent-api already serves under /api/v1/agent, so nothing is
# rewritten. The agent validates the token itself (RS256, PATIENT only).
# ---------------------------------------------------------------------------

location /api/v1/agent {
    limit_req zone=gateway_per_ip burst=20 nodelay;

    if ($has_credentials = 0) {
        return 401;
    }

    set $agent_api http://intelligent-agent-api:8086;

    proxy_pass $agent_api;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Correlation-Id  $correlation_id;
    proxy_set_header X-Forwarded-Proto $scheme;

    # A message may wait on the AI provider: up to 3 attempts of 20 s each
    # inside the agent, which answers 503 itself when they are spent.
    proxy_connect_timeout 3s;
    proxy_send_timeout    10s;
    proxy_read_timeout    70s;

    include /etc/nginx/snippets/headers.conf;
}
