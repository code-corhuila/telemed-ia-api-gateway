# ---------------------------------------------------------------------------
# professional-management routes (HU-05 professional profiles).
#
# Public path:    /api/v1/professionals/...
# Service path:   /api/professionals/...
# The gateway strips the /v1 segment before proxying.
#
# professional-management-api joins the `platform` network under that name
# and listens on :8080 (`expose` only, never published). It validates the
# token itself (RS256): any authenticated user reads professionals, and
# POST /admin/register is for the ADMIN role.
# ---------------------------------------------------------------------------

location /api/v1/professionals {
    limit_req zone=gateway_per_ip burst=20 nodelay;

    if ($has_credentials = 0) {
        return 401;
    }

    set $professional_api http://professional-management-api:8080;
    rewrite ^/api/v1/professionals(.*)$ /api/professionals$1 break;

    proxy_pass $professional_api;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-Id  $correlation_id;

    # Same as the other routes. A registration also waits on the identity
    # service, an internal call that answers well within this time.
    proxy_connect_timeout 3s;
    proxy_send_timeout    10s;
    proxy_read_timeout    15s;

    include /etc/nginx/snippets/headers.conf;
}
