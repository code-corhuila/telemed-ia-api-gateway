name: telemed-ia-api-gateway

services:
  api-gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: telemed-ia-api-gateway:local
    container_name: telemed-ia-api-gateway
    restart: unless-stopped
    healthcheck:
      # The same probe as the CI smoke test.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      # The gateway is the only service published to the host.
      - "8000:80"
    networks:
      - platform

networks:
  platform:
    external: true
    name: platform